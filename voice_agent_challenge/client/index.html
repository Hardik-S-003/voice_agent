<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Voice Agent</title>
    <meta name="description" content="Minimalist Voice Assistant powered by AI technology">
    <meta name="theme-color" content="#9B59B6">
    <link rel="manifest" href="/static/manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #9B59B6;
            --primary-dark: #8E44AD;
            --primary-light: #AF7AC5;
            --background: #1a1a1a;
            --surface: #2d2d2d;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --border: #3d3d3d;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --radius: 8px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        .header {
            padding: var(--spacing-md);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            display: inline-block;
            padding: var(--spacing-md);
            background: linear-gradient(145deg, var(--surface), #252525);
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.1);
            margin-bottom: var(--spacing-sm);
        }

        .logo i {
            margin-right: var(--spacing-sm);
            color: var(--primary-light);
        }

        .controls {
            display: flex;
            gap: var(--spacing-sm);
            margin: var(--spacing-md) 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn i {
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(145deg, var(--primary-light), var(--primary));
        }

        .btn-secondary {
            background: linear-gradient(145deg, #363636, #2d2d2d);
            color: var(--text);
            border: 1px solid var(--primary);
            box-shadow: inset 0 0 10px rgba(155, 89, 182, 0.1);
        }

        .btn-secondary:hover {
            border-color: var(--primary-light);
            background: linear-gradient(145deg, #3a3a3a, #333333);
        }

        .btn-danger {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(145deg, #ff6b6b, #e74c3c);
        }

        .chat-container {
            background: linear-gradient(145deg, #2d2d2d, #252525);
            border-radius: var(--radius);
            padding: var(--spacing-md);
            margin: var(--spacing-md) 0;
            min-height: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #chat-history {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-sm);
        }

        .chat-message {
            margin: var(--spacing-sm) 0;
            padding: var(--spacing-md);
            border-radius: var(--radius);
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .user-message {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            margin-left: auto;
            color: white;
        }

        .assistant-message {
            background: linear-gradient(145deg, #363636, #2d2d2d);
            border: 1px solid var(--border);
        }

        .text-input-container {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        #voiceTextInput {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #voiceTextInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(155, 89, 182, 0.2);
        }

        .session-info-container {
            display: flex;
            gap: var(--spacing-md);
            margin: var(--spacing-sm) 0;
            color: var(--text-muted);
            font-size: 14px;
            justify-content: center;
            background: var(--surface);
            padding: var(--spacing-sm);
            border-radius: var(--radius);
        }

        #statusTextContainer {
            color: var(--primary);
            margin: var(--spacing-sm) 0;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }

        .audio-container {
            margin-top: var(--spacing-sm);
            padding: var(--spacing-md);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            text-align: center;
            background: linear-gradient(145deg, #2d2d2d, #252525);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #advancedOptionsPanel {
            background: linear-gradient(145deg, #2d2d2d, #252525);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--spacing-md);
            margin-top: var(--spacing-sm);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .footer {
            margin-top: var(--spacing-lg);
            padding: var(--spacing-md);
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            background: var(--surface);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--surface);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
        .context-display {
            background: var(--surface);
            border-radius: var(--radius);
            padding: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            display: flex;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .context-info {
            display: flex;
            gap: var(--spacing-md);
        }

        .context-info span {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .context-info i {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-robot"></i>
                Echo AI Voice Agent
            </div>
        </div>
    </header>

    <div class="container">
        <div id="context-display" class="context-display"></div>
        <div class="session-info-container">
            <div class="session-info" id="sessionInfo">
                Session: <span id="shortSessionId">—</span>
            </div>
            <div class="message-count-badge">
                Messages: <span id="messageCount">0</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="toggleRecordBtn">
                <i class="fas fa-microphone"></i>
                Start Recording
            </button>
            <button class="btn btn-secondary" id="autoRecordToggleBtn">
                <i class="fas fa-sync-alt"></i>
                Auto Mode: ON
            </button>
            <button class="btn btn-secondary" id="textOnlyToggleBtn">
                <i class="fas fa-comment"></i>
                Text Mode: OFF
            </button>
            <button class="btn btn-danger" id="clearHistoryBtn">
                <i class="fas fa-trash"></i>
                Delete
            </button>
        </div>
        
        <div id="advancedOptionsPanel" style="display: none;">
            <div style="display: flex; gap: var(--spacing-sm); justify-content: center;">
                <button class="btn btn-secondary" id="toggleEchoFeature">
                    <i class="fas fa-bullhorn"></i> AI Echo Bot
                </button>
                <button class="btn btn-secondary" id="toggleTtsFeature">
                    <i class="fas fa-volume-up"></i> Text to Speech
                </button>
            </div>
        </div>

        <div id="statusTextContainer">
            <span id="statusText"></span>
        </div>

        <div class="chat-container">
            <div id="chat-history"></div>
            
            <div class="text-input-container">
                <input type="text" id="voiceTextInput" placeholder="Type your message...">
                <button class="btn btn-primary" id="voiceSendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div class="audio-container" id="generated-audio-container" style="display: none;">
            <i class="fas fa-music"></i>
            <p>Generated audio will appear here</p>
            <div id="audio-player-wrapper"></div>
        </div>
    </div>

    <script src="/static/index.js"></script>

    <script>
        function displayAudioPlayer(audioUrl) {
            const container = document.getElementById('generated-audio-container');
            const wrapper = document.getElementById('audio-player-wrapper');
            
            if (container && wrapper) {
                container.style.display = 'block';

                const audioPlayer = new Audio(audioUrl);
                audioPlayer.setAttribute('controls', 'true');
                audioPlayer.style.width = '100%';
                audioPlayer.style.maxWidth = '400px';
                
                const playPromise = audioPlayer.play();
                
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log("Audio started playing automatically");
                        })
                        .catch(error => {
                            console.log("Autoplay prevented by browser:", error);
                            const playButton = document.createElement('button');
                            playButton.className = 'btn btn-primary';
                            playButton.innerHTML = '<i class="fas fa-play"></i> Play Response';
                            playButton.onclick = () => audioPlayer.play();
                            wrapper.appendChild(playButton);
                        });
                }
                
                wrapper.innerHTML = '';
                wrapper.appendChild(audioPlayer);
            }
        }

        if (window.App && typeof window.App.displayAudioPlayer === 'function') {
            window.App.displayAudioPlayer = displayAudioPlayer;
        }
    </script>
</body>
</html>
