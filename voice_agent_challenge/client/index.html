<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7, #182848);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            padding: 30px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            background: #f5f7fa;
            padding: 15px;
            border-radius: 12px;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #e74c3c;
        }
        
        .indicator.recording {
            background: #2ecc71;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-record {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        
        .btn-record:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.6);
        }
        
        .btn-stop {
            background: linear-gradient(90deg, #7f8c8d, #636e72);
            color: white;
        }
        
        .btn-stop:hover {
            background: linear-gradient(90deg, #636e72, #2d3436);
        }
        
        .transcript-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .transcript {
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .response-container {
            background: #e8f4fc;
            border-radius: 12px;
            padding: 20px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .response {
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .icon {
            font-size: 1.5rem;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Voice AI Assistant</h1>
            <p class="subtitle">Speak naturally and get intelligent responses in real-time</p>
        </header>
        
        <div class="main-content">
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="indicator" id="statusIndicator"></div>
                    <span id="statusText">Ready to start</span>
                </div>
                <div id="timer">00:00</div>
            </div>
            
            <div class="controls">
                <button class="btn btn-record" id="startRecording">
                    <span class="icon">●</span> Start Recording
                </button>
                <button class="btn btn-stop" id="stopRecording" disabled>
                    <span class="icon">■</span> Stop Recording
                </button>
            </div>
            
            <div class="transcript-container">
                <h2><span class="icon">🎤</span> Your Speech</h2>
                <div class="transcript" id="transcript">
                    <p class="placeholder">Your speech will be transcribed here...</p>
                </div>
            </div>
            
            <div class="response-container">
                <h2><span class="icon">🤖</span> AI Response</h2>
                <div class="response" id="response">
                    <p class="placeholder">AI response will appear here...</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Powered by AssemblyAI STT & Google Gemini LLM | WebSocket Streaming</p>
        </footer>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
